services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-faiss:book-ready
    container_name: rag_faiss_book_example
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./workspace:/workspace
      - ./mistral-7b-instruct:/models/saved_mistral_model
      - ./llama-7b-hf:/models/saved_llama_model
      - ./qwen2.5-7b-instruct:/models/saved_qwen_model
      - ./sambalingo-chat:/models/saved_samba_model
      - ./model-cache:/models/huggingface_cache
    environment:
      MODEL: ${MODEL:-llama-7b-hf}
      RAG_MODE: ${RAG_MODE:-rag_v0}
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: "false"
      NVIDIA_VISIBLE_DEVICES: all
      HUGGING_FACE_HUB_TOKEN: ${HUGGINGFACE_TOKEN:-}
      HF_HOME: /models/huggingface_cache
      RAG_LOG_DIR: /tmp/rag-logs
    stdin_open: true
    tty: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
