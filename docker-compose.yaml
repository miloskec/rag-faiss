services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-faiss:book-ready
    container_name: rag_faiss_book_example
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./workspace:/workspace
      - ./model-cache:/models/huggingface_cache
    environment:
      MODEL_ID: ${MODEL_ID:-unsloth/Qwen3-4B-Instruct-2507-bnb-4bit}
      MODEL_LOCAL_FILES_ONLY: ${MODEL_LOCAL_FILES_ONLY:-false}
      RAG_MODE: ${RAG_MODE:-rag_v0}
      RAG_MAX_NEW_TOKENS: ${RAG_MAX_NEW_TOKENS:-128}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: "false"
      NVIDIA_VISIBLE_DEVICES: all
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/huggingface_cache
      RAG_LOG_DIR: /tmp/rag-logs
    stdin_open: true
    tty: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
